# SPDX-License-Identifier: MIT
---
name: Update OpenGrep

on:
  schedule:
    # Weekly on Monday at 09:00 UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-opengrep
  cancel-in-progress: false

jobs:
  update:
    name: Update Pinned OpenGrep Release
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Latest OpenGrep Release
        id: latest
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(mktemp)"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -o "$release_json" \
            "https://api.github.com/repos/opengrep/opengrep/releases/latest"

          python3 - "$release_json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          release_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          release = json.loads(release_path.read_text())
          # Must match ASSET_NAME resolved by resolve_opengrep_asset() in
          # scripts/validators.sh — the signed CLI asset, not opengrep-core.
          asset_name = "opengrep_manylinux_x86"

          tag_name = release.get("tag_name", "")
          version = tag_name.removeprefix("v")
          asset = next(
              (item for item in release.get("assets", [])
               if item.get("name") == asset_name),
              None,
          )

          if not re.fullmatch(r"[0-9]+[.][0-9]+[.][0-9]+(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?", version):
              raise SystemExit(f"Invalid OpenGrep release tag: {tag_name}")

          if not asset:
              raise SystemExit(f"Release asset not found: {asset_name}")

          digest = asset.get("digest", "")
          checksum = digest.removeprefix("sha256:")
          if not re.fullmatch(r"[A-Fa-f0-9]{64}", checksum):
              raise SystemExit(f"Invalid SHA256 digest for {asset_name}: {digest}")

          with output_path.open("a") as handle:
              handle.write(f"version={version}\n")
              handle.write(f"checksum={checksum}\n")
          PY

      - name: Verify Signing Identity Is Unchanged
        shell: bash
        env:
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail

          # action.yml pins the Sigstore identity it will accept. If upstream
          # renames or moves its release workflow the pin stops matching and
          # every consumer's scan fails, so surface the drift here instead.
          expected=$(grep -oP '(?<=^        COSIGN_IDENTITY=")[^"]+' action.yml)

          cert=$(mktemp)
          curl -fsSL -o "$cert" \
            "https://github.com/opengrep/opengrep/releases/download/v${LATEST_VERSION}/opengrep_manylinux_x86.cert"

          actual=$(base64 -d "$cert" \
            | openssl x509 -noout -ext subjectAltName \
            | grep -oE 'URI:\S+' \
            | cut -d: -f2-)

          if [ "$actual" != "$expected" ]; then
            printf 'Error: OpenGrep signing identity changed.\n' >&2
            printf '  action.yml pins: %s\n' "$expected" >&2
            printf '  release v%s uses: %s\n' "$LATEST_VERSION" "$actual" >&2
            printf 'Update COSIGN_IDENTITY in action.yml before bumping.\n' >&2
            exit 1
          fi

          printf 'Signing identity unchanged: %s\n' "$actual"

      - name: Update Pinned Version
        id: update
        shell: bash
        env:
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
          LATEST_CHECKSUM: ${{ steps.latest.outputs.checksum }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["LATEST_VERSION"]
          checksum = os.environ["LATEST_CHECKSUM"]

          # No re.DOTALL: every pattern below spans lines via explicit \n and
          # relies on `.` stopping at a newline. With DOTALL the lazy
          # `(?:    .+\n)*?` in the input-default pattern backtracks
          # catastrophically over the whole file and the job hangs instead of
          # opening a PR.
          def replace_once(text, pattern, replacement, description):
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"Unable to update {description}")
              return updated

          action_path = Path("action.yml")
          action_text = action_path.read_text()
          action_text = replace_once(
              action_text,
              r"(  opengrep-version:\n(?:    .+\n)*?    default: )'[^']+'",
              rf"\1'{version}'",
              "action input default",
          )
          action_text = replace_once(
              action_text,
              r'DEFAULT_OPENGREP_VERSION="[^"]+"',
              f'DEFAULT_OPENGREP_VERSION="{version}"',
              "installer default version",
          )
          action_text = replace_once(
              action_text,
              r'DEFAULT_EXPECTED_SHA256="[A-Fa-f0-9]{64}"',
              f'DEFAULT_EXPECTED_SHA256="{checksum}"',
              "installer default checksum",
          )
          action_path.write_text(action_text)

          readme_path = Path("README.md")
          readme_text = readme_path.read_text()
          readme_text = replace_once(
              readme_text,
              r"(\| `opengrep-version` \| `)[^`]+(` \|)",
              rf"\g<1>{version}\2",
              "README input table default",
          )
          readme_text = re.sub(
              r"opengrep-version: '[0-9]+[.][0-9]+[.][0-9]+(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?'",
              f"opengrep-version: '{version}'",
              readme_text,
          )
          readme_text = re.sub(
              r"opengrep-checksum: '[A-Fa-f0-9]{64}'",
              f"opengrep-checksum: '{checksum}'",
              readme_text,
          )
          readme_path.write_text(readme_text)
          PY

          if git diff --quiet -- action.yml README.md; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            printf 'OpenGrep is already pinned to v%s.\n' "$LATEST_VERSION"
            exit 0
          fi

          printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          git diff -- action.yml README.md

      - name: Prepare update branch
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
          LATEST_CHECKSUM: ${{ steps.latest.outputs.checksum }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          branch="automation/opengrep-v${LATEST_VERSION}"
          base_sha="$(git rev-parse HEAD)"

          # Commit through createCommitOnBranch rather than `git commit`.
          #
          # main requires signed commits. A commit made by the shell here is
          # authored by github-actions[bot] with no signature, so the resulting
          # PR cannot be merged. Commits created through this mutation are
          # signed by GitHub server-side and satisfy the rule.
          #
          # The mutation needs the branch to exist first, so point the ref at
          # the base commit (creating or resetting it), then commit onto it.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" \
              -f sha="$base_sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${branch}" -f sha="$base_sha" >/dev/null
          fi

          read -r -d '' query <<'GRAPHQL' || true
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { url }
            }
          }
          GRAPHQL

          commit_url=$(jq -n \
            --arg query "$query" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$branch" \
            --arg headline "security: update opengrep to v${LATEST_VERSION}" \
            --arg oid "$base_sha" \
            --arg action_yml "$(base64 -w0 action.yml)" \
            --arg readme "$(base64 -w0 README.md)" \
            '{
              query: $query,
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repo,
                    branchName: $branch
                  },
                  message: {headline: $headline},
                  expectedHeadOid: $oid,
                  fileChanges: {
                    additions: [
                      {path: "action.yml", contents: $action_yml},
                      {path: "README.md", contents: $readme}
                    ]
                  }
                }
              }
            }' \
            | gh api graphql --input - \
              --jq '.data.createCommitOnBranch.commit.url')

          printf 'Created signed commit: %s\n' "$commit_url"

          body=$(cat <<EOF
          Updates the default OpenGrep release used by this action.

          - OpenGrep version: v${LATEST_VERSION}
          - \`opengrep_manylinux_x86\` checksum: \`${LATEST_CHECKSUM}\`

          The checksum above is verified before installation, and the asset's
          Sigstore signature is checked against the identity pinned in
          \`action.yml\` — which this workflow confirmed is unchanged.
          EOF
          )

          title="security: update OpenGrep to v${LATEST_VERSION}"

          existing_pr=$(gh pr list \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          # Updating an existing PR is permitted; creating one is not.
          #
          # GITHUB_TOKEN cannot open pull requests here — the repository keeps
          # "Allow GitHub Actions to create and approve pull requests" off,
          # because that toggle also grants Actions the ability to approve.
          # A token-opened PR would additionally run no CI, since events raised
          # by GITHUB_TOKEN do not start new workflow runs.
          #
          # So: refresh the PR if one is already open, otherwise hand a
          # pre-filled link to whoever reads the run.
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "$title" --body "$body"
            pr_url=$(gh pr view "$existing_pr" --json url --jq '.url')
            {
              printf '## 🔄 OpenGrep v%s\n\n' "$LATEST_VERSION"
              printf 'Updated existing **[PR #%s](%s)**.\n' "$existing_pr" "$pr_url"
            } >> "$GITHUB_STEP_SUMMARY"
            printf 'Updated PR: %s\n' "$pr_url"
          else
            server="${GITHUB_SERVER_URL:-https://github.com}"
            pr_url="${server}/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${branch}?expand=1"
            pr_url="${pr_url}&title=$(printf '%s' "$title" | jq -sRr @uri)"
            pr_url="${pr_url}&body=$(printf '%s' "$body" | jq -sRr @uri)"
            {
              printf '## 🔄 OpenGrep v%s available\n\n' "$LATEST_VERSION"
              printf "Branch \`%s\` is pushed with a signed commit.\n\n" "$branch"
              printf '**[→ Open the pull request](%s)**\n\n' "$pr_url"
              printf 'The form is pre-filled; opening it as yourself is what makes CI run.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            printf 'Open the PR: %s\n' "$pr_url"
          fi
