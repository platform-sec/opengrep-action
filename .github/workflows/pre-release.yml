# SPDX-License-Identifier: MIT
---
name: Pre-Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
          - custom
      custom_version:
        description: 'Custom version (only if custom selected)'
        required: false
        type: string
      prerelease_suffix:
        description: 'Prerelease suffix (alpha, beta, rc)'
        required: false
        default: 'beta'
        type: choice
        options:
          - alpha
          - beta
          - rc
      create_release:
        description: 'Create release immediately'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      # No pull-requests scope: this job pushes a branch and prints a link,
      # it never touches the PR API.
      contents: write
      actions: read
    outputs:
      new-version: ${{ steps.version.outputs.new-version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Get current version
        id: current-version
        run: |
          # Get the latest tag
          LATEST_TAG=$(git tag --sort=-version:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "current-version=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Current version: $LATEST_TAG"

      - name: Calculate new version
        id: version
        env:
          CURRENT: ${{ steps.current-version.outputs.current-version }}
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
          PRERELEASE_SUFFIX: ${{ github.event.inputs.prerelease_suffix }}
        run: |

          # Remove 'v' prefix for calculation
          # shellcheck disable=SC2001
          CURRENT_NO_V=$(echo "$CURRENT" | sed 's/^v//')

          case "$VERSION_TYPE" in
            custom)
              if [ -z "$CUSTOM_VERSION" ]; then
                echo "❌ Custom version is required when version_type is custom"
                exit 1
              fi
              NEW_VERSION="$CUSTOM_VERSION"
              ;;
            patch)
              NEW_VERSION=$(echo "$CURRENT_NO_V" | awk -F. '{$3 = $3 + 1} 1' OFS=".")
              ;;
            minor)
              NEW_VERSION=$(echo "$CURRENT_NO_V" | awk -F. '{$2 = $2 + 1; $3 = 0} 1' OFS=".")
              ;;
            major)
              NEW_VERSION=$(echo "$CURRENT_NO_V" | awk -F. '{$1 = $1 + 1; $2 = 0; $3 = 0} 1' OFS=".")
              ;;
            prerelease)
              # Check if current version is already a prerelease
              if [[ "$CURRENT_NO_V" =~ -([a-zA-Z]+)\.([0-9]+)$ ]]; then
                # Increment prerelease number
                # shellcheck disable=SC2001
                PREFIX=$(echo "$CURRENT_NO_V" | sed 's/-[a-zA-Z]\+\.[0-9]\+$//')
                SUFFIX=$(echo "$CURRENT_NO_V" | grep -o '[a-zA-Z]\+' | tail -n 1)
                NUMBER=$(echo "$CURRENT_NO_V" | grep -o '[0-9]\+$')
                NEW_NUMBER=$(("$NUMBER" + 1))
                NEW_VERSION="${PREFIX}-${SUFFIX}.${NEW_NUMBER}"
              else
                # Create first prerelease
                NEW_VERSION="${CURRENT_NO_V}-${PRERELEASE_SUFFIX}.1"
              fi
              ;;
            *)
              echo "❌ Unknown version type: $VERSION_TYPE"
              exit 1
              ;;
          esac

          # Add 'v' prefix back
          NEW_VERSION="v$NEW_VERSION"

          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Calculated new version: $NEW_VERSION"

      - name: Create pre-release fixture
        run: |
          source tests/helpers/format-output-validation.sh
          create_format_fixture test-code/pre-release-format

      - name: Run pre-release basic scan
        id: pre-release-basic
        uses: ./
        with:
          target: 'test-code/pre-release-format/src/'
          patterns: 'test-code/pre-release-format/rules.yml'
          output-format: 'json/sarif'
          strict: 'false'

      - name: Verify pre-release basic scan
        run: |
          set -euo pipefail
          source tests/helpers/format-output-validation.sh
          assert_format_json_finding "${STEPS_BASIC_OUTPUTS_JSON_FILE}"
          assert_format_sarif_finding "${STEPS_BASIC_OUTPUTS_SARIF_FILE}"
        env:
          STEPS_BASIC_OUTPUTS_JSON_FILE: ${{ steps.pre-release-basic.outputs.json-file }}
          STEPS_BASIC_OUTPUTS_SARIF_FILE: ${{ steps.pre-release-basic.outputs.sarif-file }}

      - name: Run pre-release integration scan
        id: pre-release-integration
        uses: ./
        with:
          target: 'test-code/'
          patterns: 'auto'
          output-format: 'json/sarif'
          strict: 'false'

      - name: Verify pre-release integration scan
        run: |
          set -euo pipefail
          source tests/helpers/format-output-validation.sh
          assert_valid_json_file "${STEPS_INTEGRATION_OUTPUTS_JSON_FILE}"
          assert_valid_sarif_file "${STEPS_INTEGRATION_OUTPUTS_SARIF_FILE}"
        env:
          STEPS_INTEGRATION_OUTPUTS_JSON_FILE: ${{ steps.pre-release-integration.outputs.json-file }}
          STEPS_INTEGRATION_OUTPUTS_SARIF_FILE: ${{ steps.pre-release-integration.outputs.sarif-file }}

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_VERSION="${STEPS_CURRENT_VERSION_OUTPUTS_CURRENT_VERSION}"
          NEW_VERSION="${STEPS_VERSION_OUTPUTS_NEW_VERSION}"

          echo "Generating changelog from $CURRENT_VERSION to $NEW_VERSION"

          # Bucket commits by conventional-commit type.
          #
          # Match the *subject only*, anchored, with the optional scope and
          # breaking-change marker. `git log --grep` searches the whole message
          # and is unanchored, which put one commit in four sections at once
          # and filed every merge commit under Security because the org name
          # contains "sec".
          KNOWN='^(feat|fix|security|docs|test)(\([^)]+\))?!?:'

          bucket() {
            # bucket <extended-regex> [invert]; prints "- <subject>" lines.
            # Pipe git directly rather than through a variable: printf on an
            # empty subject list emits a blank line, which survives an
            # inverted match and renders as a stray "- " entry.
            local flag="-E"
            [ "${2:-}" = "invert" ] && flag="-Ev"
            git log --no-merges --pretty='%s' "${CURRENT_VERSION}..HEAD" \
              | grep "$flag" "$1" | sed 's/^/- /' || true
          }

          # shellcheck disable=SC2086,SC2129
          CHANGELOG=$(cat << EOF
          ## Changes in $NEW_VERSION

          ### 🚀 New Features
          $(bucket '^feat(\([^)]+\))?!?:')

          ### 🐛 Bug Fixes
          $(bucket '^fix(\([^)]+\))?!?:')

          ### 🔒 Security Updates
          $(bucket '^security(\([^)]+\))?!?:')

          ### 📝 Documentation
          $(bucket '^docs(\([^)]+\))?!?:')

          ### 🧪 Testing
          $(bucket '^test(\([^)]+\))?!?:')

          ### Other Changes
          $(bucket "$KNOWN" invert)
          EOF
          )

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          STEPS_CURRENT_VERSION_OUTPUTS_CURRENT_VERSION: ${{ steps.current-version.outputs.current-version }}
          STEPS_VERSION_OUTPUTS_NEW_VERSION: ${{ steps.version.outputs.new-version }}

      - name: Create tag (if create_release is true)
        if: github.event.inputs.create_release == 'true'
        run: |
          NEW_VERSION="${STEPS_VERSION_OUTPUTS_NEW_VERSION}"

          # Create and push tag
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$NEW_VERSION"

          echo "🏷️ Tag $NEW_VERSION created and pushed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STEPS_VERSION_OUTPUTS_NEW_VERSION: ${{ steps.version.outputs.new-version }}

      - name: Prepare release branch (if create_release is false)
        if: github.event.inputs.create_release == 'false'
        run: |
          set -euo pipefail

          NEW_VERSION="${STEPS_VERSION_OUTPUTS_NEW_VERSION}"
          BRANCH_NAME="release/prepare-$NEW_VERSION"
          BASE_SHA="$(git rev-parse HEAD)"

          # Usage examples are pinned to full commit SHAs; release prep should
          # not rewrite them to mutable version tags.

          # Create release notes file
          printf '%s\n' "$STEPS_CHANGELOG_OUTPUTS_CHANGELOG" > RELEASE_NOTES.md

          # Commit through createCommitOnBranch rather than `git commit`.
          #
          # main requires signed commits. A shell commit here is authored by
          # the workflow with no signature, so the preparation PR could only
          # ever be squash-merged — and merging it any other way is blocked.
          # Commits created through this mutation are signed by GitHub.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH_NAME}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH_NAME}" \
              -f sha="$BASE_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${BRANCH_NAME}" -f sha="$BASE_SHA" >/dev/null
          fi

          read -r -d '' mutation <<'GRAPHQL' || true
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { url }
            }
          }
          GRAPHQL

          commit_url=$(jq -n \
            --arg query "$mutation" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH_NAME" \
            --arg headline "chore: prepare release $NEW_VERSION" \
            --arg oid "$BASE_SHA" \
            --arg notes "$(base64 -w0 RELEASE_NOTES.md)" \
            '{
              query: $query,
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repo,
                    branchName: $branch
                  },
                  message: {headline: $headline},
                  expectedHeadOid: $oid,
                  fileChanges: {
                    additions: [{path: "RELEASE_NOTES.md", contents: $notes}]
                  }
                }
              }
            }' \
            | gh api graphql --input - \
              --jq '.data.createCommitOnBranch.commit.url')

          printf 'Created signed commit: %s\n' "$commit_url"

          # Emit a link instead of opening the PR from CI.
          #
          # GITHUB_TOKEN cannot create pull requests here: the repository has
          # "Allow GitHub Actions to create and approve pull requests" off, and
          # it stays off deliberately — that single toggle also grants Actions
          # the ability to *approve* PRs, which would undercut any review
          # requirement later added to main.
          #
          # Opening the PR from CI would be the wrong outcome even if it were
          # permitted: events raised by GITHUB_TOKEN do not start new workflow
          # runs, so the release PR would carry no CI results at all. A PR
          # opened by a human gets the full check suite.
          pr_title="🚀 Prepare release $NEW_VERSION"
          pr_body="This PR prepares the release for $NEW_VERSION.

          ## Changes
          The generated changelog is committed as \`RELEASE_NOTES.md\` — review it in the diff.

          ## Next Steps
          1. Review the changes
          2. Merge this PR
          3. Create a tag \`$NEW_VERSION\` to trigger the release workflow

          ## Quick Release
          After merging, run:
          \`\`\`bash
          git tag -a $NEW_VERSION -m \"Release $NEW_VERSION\"
          git push origin $NEW_VERSION
          \`\`\`"

          server="${GITHUB_SERVER_URL:-https://github.com}"
          pr_url="${server}/${GITHUB_REPOSITORY}/compare/main...${BRANCH_NAME}?expand=1"
          pr_url="${pr_url}&title=$(printf '%s' "$pr_title" | jq -sRr @uri)"
          pr_url="${pr_url}&body=$(printf '%s' "$pr_body" | jq -sRr @uri)"

          {
            printf '## 🚀 Release %s prepared\n\n' "$NEW_VERSION"
            printf "Branch \`%s\` is pushed with a signed commit.\n\n" "$BRANCH_NAME"
            printf '**[→ Open the pull request](%s)**\n\n' "$pr_url"
            printf 'The form is pre-filled; opening it as yourself is what makes CI run.\n\n'
            printf '<details><summary>Generated changelog</summary>\n\n%s\n\n</details>\n' \
              "$STEPS_CHANGELOG_OUTPUTS_CHANGELOG"
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'Open the PR: %s\n' "$pr_url"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STEPS_VERSION_OUTPUTS_NEW_VERSION: ${{ steps.version.outputs.new-version }}
          STEPS_CHANGELOG_OUTPUTS_CHANGELOG: ${{ steps.changelog.outputs.changelog }}

  output-summary:
    runs-on: ubuntu-latest
    needs: prepare-release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Release Summary
        env:
          CREATE_RELEASE: ${{ github.event.inputs.create_release }}
          NEEDS_PREPARE_RELEASE_OUTPUTS_NEW_VERSION: ${{ needs.prepare-release.outputs.new-version }}
        run: |
          # shellcheck disable=SC2129
          echo "## 🚀 Release Preparation Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**New Version:** ${NEEDS_PREPARE_RELEASE_OUTPUTS_NEW_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Action Taken:**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CREATE_RELEASE" == "true" ]; then
            echo "- ✅ Tag created and release workflow triggered" >> "$GITHUB_STEP_SUMMARY"
            release_url="https://github.com/${{ github.repository }}/releases/tag"
            release_tag="${NEEDS_PREPARE_RELEASE_OUTPUTS_NEW_VERSION}"
            echo "- 📦 Release will be available at: $release_url/$release_tag" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 📝 Preparation branch pushed with a signed commit" >> "$GITHUB_STEP_SUMMARY"
            echo "- 🔗 Open the PR via the link in the \`prepare-release\` summary" >> "$GITHUB_STEP_SUMMARY"
            echo "- 🔍 Review the PR and merge when ready" >> "$GITHUB_STEP_SUMMARY"
            echo "- 🏷️ Create tag manually to trigger release" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Usage" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin workflow usage to the full release commit SHA." >> "$GITHUB_STEP_SUMMARY"
